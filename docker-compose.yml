services:
  orders-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - "5433:5432"

  payments-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments_db
    ports:
      - "5434:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-ap2
    ports:
      - "5672:5672"
      - "15672:15672"

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    ports:
      - "50052:50052"
    environment:
      PAYMENT_DB_URL: postgres://postgres:postgres@payments-db:5432/payments_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_GRPC_PORT: "50052"
    depends_on:
      - payments-db
      - rabbitmq

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      ORDER_DB_URL: postgres://postgres:postgres@orders-db:5432/orders_db?sslmode=disable
      PAYMENT_GRPC_ADDR: payment-service:50052
      HTTP_PORT: "8080"
    depends_on:
      - orders-db
      - payment-service

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq